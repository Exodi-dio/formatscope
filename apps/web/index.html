<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>FormatScope — Binary Format Workbench</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  margin: 0;
  background: #0a0a0e;
  color: #eceef1;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.app {
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  padding: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid #242a33;
  background: #0b0c0e;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #eceef1;
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-decoration: none;
}
.brand-mark {
  width: 30px;
  height: 32px;
  background: #111318;
  border: 1px solid #242a33;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.brand-mark span { font-size: 16px; }
.status {
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: #98a0ab;
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.shell {
  display: flex;
  flex: 1;
  background: #0b0c0e;
}
.sidebar {
  width: 210px;
  flex-shrink: 0;
  background: #101118;
  border-right: 1px solid var(--line);
}
.nav {
  display: flex;
  flex-direction: column;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  color: var(--muted);
  font-size: 0.88rem;
  text-decoration: none;
  cursor: pointer;
}
.nav-item:hover {
  background: #151920;
  color: var(--text);
}
.nav-item-active {
  background: #151920;
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  font-weight: 500;
}
.main {
  flex: 1;
  background: var(--bg);
  padding: 2rem;
  overflow-y: auto;
}
.drop-zone {
  border: 2px dashed var(--line);
  border-radius: 14px;
  padding: 3rem 2rem;
  text-align: center;
  background: #101118;
  margin-bottom: 20px;
  cursor: pointer;
}
.drop-zone:hover {
  border-color: var(--accent);
  background: #141a24;
}
.drop-zone-mark {
  display: inline-flex;
  gap: 22px;
  padding: 9px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0d1013;
  color: var(--accent);
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 11px;
  margin-bottom: 12px;
}
.drop-zone h2 {
  margin: 8px 0 4px 0;
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.drop-zone p {
  color: #98a0ab;
  font-size: 13px;
  line-height: 1.55;
  max-width: 46ch;
  margin: 0 auto;
}
.file-info {
  margin-top: 20px;
  background: #101118;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 20px;
}
.file-info h3 {
  margin: 0 0 8px 0;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
}
.file-info-item {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  font-size: 13px;
  color: #98a0ab;
  font-family: ui-monospace, SFMono-Regular, monospace;
}
.file-info-item .label { color: var(--muted); }
.inference-section {
  margin-top: 22px;
}
.inference-section h3 {
  margin: 0 0 10px 0;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
}
.result-card {
  background: #111318;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 10px;
}
.result-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.result-kind {
  font-size: 0.82rem;
  font-weight: 700;
  color: #7dd3a7;
}
.result-offset {
  font-family: ui-monospace, monospace;
  font-size: 0.8rem;
  color: #98a0ab;
}
.result-detail-row {
  margin: 6px 0 6px 0;
  font-size: 0.88rem;
  color: var(--muted);
  font-family: ui-monospace, monospace;
}
.result-detail-row b { color: var(--text); }
.verify-section {
  margin-top: 24px;
  background: #101118;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 22px;
}
.verify-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.verify-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.9rem;
  font-weight: 600;
  font-family: ui-monospace, monospace;
}
.verify-badge.ok { background: rgba(125,211,167,0.15); color: #7dd3a7; border: 1px solid rgba(125,211,167,0.2); }
.verify-badge.fail { background: rgba(255,107,107,0.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.2); }
.verify-offset { font-size: 0.85rem; }
.empty-state {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 30px 20px;
}
.file-input { display: none; }
.btn {
  padding: 7px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #151920;
  color: var(--text);
  font-size: 0.88rem;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.entropy-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  font-size: 0.88rem;
  color: var(--text);
  border-bottom: 1px solid #151920;
}
.entropy-bar {
  flex: 1;
  height: 10px;
  background: #111318;
  border-radius: 5px;
  overflow: hidden;
}
.entropy-bar-fill {
  height: 100%;
  border-radius: 5px;
  background: #7dd3a7;
}
.scan-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  font-size: 0.88rem;
  color: var(--text);
  border-bottom: 1px solid #151920;
}
.scan-item:last-child { border-bottom: none; }
.scan-kind {
  color: #7dd3a7;
  font-family: ui-monospace, monospace;
  font-size: 0.8rem;
  width: 100px;
}
.scan-offset {
  color: #98a0ab;
  font-family: ui-monospace, monospace;
  font-size: 0.8rem;
  width: 80px;
}
.scan-confidence {
  color: #7dd3a7;
  font-family: ui-monospace, monospace;
  font-size: 0.8rem;
  width: 110px;
}
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">&#9652;</div>
        <span>FormatScope</span>
      </div>
      <div class="status">local only</div>
    </header>

    <div class="shell">
      <aside class="sidebar">
        <nav class="nav">
          <div class="nav-item nav-item-active">
            <span class="nav-icon">&#127968;</span>
            <span class="nav-label">Dashboard</span>
          </div>
          <div class="nav-item">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Tasks</span>
          </div>
          <div class="nav-item">
            <span class="nav-icon">📥</span>
            <span class="nav-label">Inbox</span>
          </div>
          <div class="nav-item">
            <span class="nav-icon">📅</span>
            <span class="nav-label">Calendar</span>
          </div>
          <div class="nav-item">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Meeting</span>
          </div>
          <div class="nav-item">
            <span class="nav-icon">📦</span>
            <span class="nav-label">Dock</span>
          </div>
        </nav>
      </aside>

      <main class="main">
        <div class="drop-zone">
          <div class="drop-zone-mark"><span>0x00</span><span>0xff</span></div>
          <input type="file" id="file-input" class="file-input" />
          <label class="drop-trigger" style="cursor: pointer;">
            <h2>Drop a binary file</h2>
            <p>Infer structure, generate parser, verify byte-for-byte round-trip. Nothing leaves this tab.</p>
          </label>
        </div>

        <div class="file-info">
          <h3 id="file-name">No file loaded</h3>
          <div class="file-info-item"><span class="label">Size</span><span id="file-size">-</span></div>
          <div class="file-info-item"><span class="label">Type</span><span id="file-type">-</span></div>
        </div>

        <div class="inference-section">
          <h3>Inference Results</h3>
          <div id="inference-results"></div>
        </div>

        <div class="scan-section">
          <h3>Scan Results</h3>
          <div id="scan-results"></div>
        </div>

        <div class="verify-section">
          <div class="verify-header">
            <span class="verify-badge" id="verify-badge">
              <span style="color:#7dd3a7">&#9679;</span> verify ok
            </span>
            <span class="verify-offset">0x0000</span>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <span>core 0.1.0</span>
      <span>no uploads · no telemetry</span>
    </footer>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const dropZone = document.querySelector('.drop-zone');
    const fileNameEl = document.getElementById('file-name');
    const fileSizeEl = document.getElementById('file-size');
    const fileTypeEl = document.getElementById('file-type');
    const resultsEl = document.getElementById('inference-results');
    const scanResultsEl = document.getElementById('scan-results');
    const verifyBadge = document.getElementById('verify-badge');
    const verifyOffsetEl = document.getElementById('verify-offset');

    function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function shannon(window) {
      const length = window.byteLength;
      if (length === 0) return 0;
      const counts = new Uint32Array(256);
      for (let i = 0; i < length; i++) counts[window[i]]++;
      let entropy = 0;
      const invLength = 1 / length;
      for (let s = 0; s < 256; s++) {
        const c = counts[s];
        if (c === 0) continue;
        const p = c * invLength;
        entropy -= p * Math.log2(p);
      }
      return entropy;
    }

    function scanMagic(bytes) {
      const magics = [
        {name:'FSBX', bytes:[0x46,0x53,0x42,0x58]},
        {name:'FSRT', bytes:[0x46,0x53,0x52,0x54]},
        {name:'FSTL', bytes:[0x46,0x53,0x54,0x4c]},
        {name:'MZ', bytes:[0x4d,0x5a]},
        {name:'PE', bytes:[0x50,0x45,0x00,0x00]},
        {name:'ELF', bytes:[0x7f,0x45,0x4c,0x46]},
        {name:'ZIP', bytes:[0x50,0x4b,0x03,0x04]},
        {name:'PDF', bytes:[0x25,0x50,0x44,0x46]},
        {name:'PNG', bytes:[0x89,0x50,0x4e,0x47]},
        {name:'JPEG', bytes:[0xff,0xd8,0xff]},
        {name:'GIF', bytes:[0x47,0x49,0x46,0x38]},
        {name:'BMP', bytes:[0x42,0x4d]},
        {name:'WAV', bytes:[0x52,0x49,0x46,0x46]},
        {name:'MP3', bytes:[0x49,0x44,0x33]},
        {name:'SQLite', bytes:[0x53,0x51,0x4c,0x69,0x74,0x65]}
      ];
      const hypotheses = [];
      for (const magic of magics) {
        if (bytes.byteLength < magic.bytes.byteLength) continue;
        let match = true;
        for (let i = 0; i < magic.bytes.byteLength; i++) {
          if (bytes[i] !== magic.bytes[i]) { match = false; break; }
        }
        if (match) results.push({kind:'magic', offset:0, length:magic.bytes.byteLength, name:magic.name, confidence:0.95});
      }
      return results;
    }

    function scanStrings(bytes) {
      const results = [];
      let start = -1;
      const MIN = 4;
      for (let i = 0; i < bytes.byteLength; i++) {
        const b = bytes[i];
        if (b >= 0x20 && b <= 0x7e) {
          if (start === -1) start = i;
        } else {
          if (start !== -1) {
            if (i - start >= MIN) results.push({kind:'string', offset:start, length:i-start, confidence:0.60});
            start = -1;
          }
        }
      }
      if (start !== -1 && bytes.byteLength - start >= MIN) results.push({kind:'string', offset:start, length:bytes.byteLength-start, confidence:0.60});
      return results;
    }

    function scanPeriodicity(bytes){
      const results = [];
      const maxStride = Math.min(32, Math.floor(bytes.byteLength/2));
      for (let stride = 1; stride <= maxStride; stride++) {
        let matches = 0, total = 0;
        for (let i = 0; i < bytes.byteLength - stride; i++) {
          total++;
          if (bytes[i] === bytes[i+stride]) matches++;
        }
        if (total === 0) continue;
        const ratio = matches / total;
        if (ratio < 0.8) continue;
        results.push({kind:'periodicity', offset:0, length:bytes.byteLength, confidence:Math.min(0.95, 0.70 + 0.05*stride)*ratio});
      }
      return results;
    }

    function scanEntropy(bytes, windowSize=16) {
      const regions = [];
      const step = Math.min(windowSize, bytes.byteLength);
      for (let offset = 0; offset < bytes.byteLength; offset += step) {
        const length = Math.min(step, bytes.byteLength - offset);
        regions.push({offset, length, entropy: shannon(bytes.subarray(offset, offset+length))});
      }
      return regions;
    }

    function isPrintable(b) { return b >= 0x20 && b <= 0x7e; }

    function scanXORSingle(bytes) {
      const results = [];
      const len = bytes.byteLength;
      if (len === 0) return results;
      const candidates = [];
      for (let key = 0; key < 256; key++) {
        let match = 0;
        for (let i = 0; i < len; i++) {
          const b = bytes[i] ^ key;
          if (b >= 0x20 && b <= 0x7e) match++;
        }
        const conf = match / len;
        if (conf > 0.7) candidates.push({offset:0, length:len, kind:'xor', confidence:conf, evidence:[`XOR single-byte key 0x${key.toString(16).padStart(2,'0')}`], key:key});
      }
      candidates.sort((a,b) => b.confidence - a.confidence);
      return candidates.slice(0, 3);
    }

    function scanXORRepeating(bytes) {
      const results = [];
      const len = bytes.byteLength;
      if (len < 8) return results;
      const best = [];
      for (let stride = 1; stride <= Math.min(64, Math.floor(len/2)); stride++) {
        const groups = [];
        for (let i = 0; i < stride; i++) groups[i] = [];
        for (let i = 0; i < len; i++) groups[i % stride].push(bytes[i]);
        let totalMatch = 0, totalPos = 0;
        const key = [];
        for (let i = 0; i < stride; i++) {
          const group = groups[i];
          const counts = new Uint32Array(256);
          for (const b of group) counts[b]++;
          let bestCount = 0, bestSym = 0;
          for (let s = 0; s < 256; s++) {
            if (counts[s] > bestCount) { bestCount = counts[s]; bestSym = s; }
          }
          key[i] = bestSym;
          totalMatch += bestCount;
          totalPos += group.length;
        }
        const conf = totalMatch / totalPos;
        if (conf > 0.75) {
          results.push({kind:'xor', offset:0, length:len, confidence:conf, evidence:[`XOR repeating key stride=${stride}`], key:key});
        }
      }
      results.sort((a,b) => b.confidence - a.confidence);
      return results.slice(0, 3);
    }

    function scanECB(bytes) {
      const results = [];
      const len = bytes.byteLength;
      if (len < 32) return results;
      const blocks = [];
      for (let i = 0; i + 16 <= len; i += 16) {
        const hex = [];
        for (let j = 0; j < 16; j++) hex.push(bytes[i+j].toString(16).padStart(2,'0'));
        blocks.push(hex.join(''));
      }
      const seen = {};
      let repeats = 0;
      for (const b of blocks) {
        if (seen[b]) repeats++;
        else seen[b] = 1;
      }
      const ratio = blocks.length > 0 ? repeats / blocks.length : 0;
      if (ratio > 0.1) {
        results.push({kind:'aes', offset:0, length:len, confidence:Math.min(0.99, ratio * 2), evidence:[`AES-ECB-like: ${repeats} repeated 16-byte blocks`]});
      }
      return results;
    }

    function loadFile(file) {
      fileNameEl.textContent = file.name;
      fileSizeEl.textContent = formatSize(file.size);
      fileTypeEl.textContent = file.type || 'application/octet-stream';
      const reader = new FileReader();
      reader.onload = (e) => {
        const bytes = new Uint8Array(e.target.result);
        updateResults(bytes);
      };
      reader.readAsArrayBuffer(file);
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function updateResults(bytes) {
      const magic = scanMagic(bytes);
      const strings = scanStrings(bytes);
      const periodicity = scanPeriodicity(bytes);
      const entropy = scanEntropy(bytes);
      const xorsingle = scanXORSingle(bytes);
      const xorrepeat = scanXORRepeating(bytes);
      const ecb = scanECB(bytes);

      const all = [
        ...magic.map(h => ({...h, score: h.confidence * h.length})),
        ...strings.map(h => ({...h, score: h.confidence * h.length})),
        ...periodicity.map(h => ({...h, score: h.confidence * h.length})),
        ...xorsingle.map(h => ({...h, score: h.confidence * h.length})),
        ...xorrepeat.map(h => ({...h, score: h.confidence * h.length})),
        ...ecb.map(h => ({...h, score: h.confidence * h.length})),
      ];
      all.sort((a,b) => b.score - a.score || a.offset - b.offset);

      const resultsEl = document.getElementById('inference-results');
      resultsEl.innerHTML = '';
      if (all.length === 0) {
        resultsEl.innerHTML = '<div class="empty-state">No inference rules matched</div>';
      } else {
        for (const h of all.slice(0, 10)) {
          const div = document.createElement('div');
          div.className = 'result-card';
          div.innerHTML = `
            <div class="result-header">
              <span class="result-kind">${escapeHtml(h.kind)}</span>
              <span class="result-offset">0x${h.offset.toString(16).padStart(4,'0')}</span>
            </div>
            <div class="result-details">
              <span>length: ${h.length}</span>
              <span>confidence: ${(h.confidence*100).toFixed(1)}%</span>
              ${h.name ? `<span>name: ${escapeHtml(h.name)}</span>` : ''}
              ${h.key !== undefined ? `<span>key: 0x${h.key.toString(16).padStart(2,'0')}</span>` : ''}
            </div>
          `;
          resultsEl.appendChild(div);
        }
      }

      const scanRes = document.getElementById('scan-results');
      scanRes.innerHTML = '';
      const allScans = [...magic, ...strings, ...periodicity];
      if (allScans.length === 0) {
        scanRes.innerHTML = '<div class="empty-state">No scan results</div>';
      } else {
        for (const h of allScans.slice(0, 20)) {
          const div = document.createElement('div');
          div.className = 'scan-item';
          div.innerHTML = `
            <span class="scan-kind">${escapeHtml(h.kind)}</span>
            <span class="scan-offset">0x${h.offset.toString(16).padStart(4,'0')}</span>
            <span class="scan-confidence">${(h.confidence*100).toFixed(1)}%</span>
          `;
          scanRes.appendChild(div);
        }
      }

      const decoded = encode(decode({}, bytes));
      const result = verifyBytes(bytes, decoded);
      const badge = document.getElementById('verify-badge');
      const offsetEl = document.getElementById('verify-offset');
      badge.className = result.ok ? 'verify-badge ok' : 'verify-badge fail';
      badge.innerHTML = `<span style="color:${result.ok ? '#7dd3a7' : '#ff6b6b'}">&#9679;</span> ${result.ok ? 'verify ok' : 'verify failed'}`;
      offsetEl.textContent = result.firstDiffOffset !== null ? '0x'+result.firstDiffOffset.toString(16).padStart(4,'0') : '—';
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadFile(file);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) loadFile(file);
    });

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        fileInput.click();
      }
    });
  </script>
</body>
</html>
