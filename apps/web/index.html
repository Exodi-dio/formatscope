<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Infer the structure of an unknown binary file, generate a parser, and prove it with a byte-for-byte round-trip."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c0e'/%3E%3Cpath d='M8 9h6v5H8zm0 9h16v5H8z' fill='%237dd3a7'/%3E%3C/svg%3E"
    />
    <title>FormatScope — binary format workbench</title>
    <style>
      body { margin: 0; background: #0b0c0e; color: #eceef1; font-family: system-ui, sans-serif; }
      #root { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #mount-error { text-align: center; padding: 2rem; }
      #mount-error h2 { color: #ff6b6b; margin-bottom: 1rem; }
      #mount-error p { color: #98a0ab; max-width: 500px; margin: 0 auto; }
      #mount-error button { padding: 0.8rem 1.5rem; background: #7dd3a7; color: #0b0c0e; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="mount-error">
        <h2>FormatScope failed to load</h2>
        <p id="mount-error-msg">JavaScript error during app initialization</p>
        <button onclick="window.location.reload()">Refresh</button>
      </div>
    </div>
    <script>
      // Test: if JS runs, change body background to yellow
      document.body.style.background = "#ffeb3b";
      document.body.style.color = "#000000";
      window.addEventListener('error', function(e) {
        var el = document.getElementById('mount-error-msg');
        if (el) el.textContent = 'JS Error: ' + (e.message || 'unknown');
        document.getElementById('mount-error').style.display = 'block';
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('mount-error-msg');
        if (el) el.textContent = 'Unhandled rejection: ' + (e.reason || 'unknown');
        document.getElementById('mount-error').style.display = 'block';
      });
    </script>
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </body>
</html>
