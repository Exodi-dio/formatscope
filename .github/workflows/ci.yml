name: ci

on:
  push:
    branches:
      - main
      - "s1/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install
        run: npm ci --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm test -- --coverage

      - name: build
        run: npm run build

      - name: upload build
        if: matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
          if-no-files-found: error
