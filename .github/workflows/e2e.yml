name: e2e

on:
  push:
    branches:
      - main
      - "s1/**"
      - "s2/**"
      - "s3/**"
      - "s4/**"
      - "s5/**"
      - "s6/**"
      - "s7/**"
      - "s8/**"
      - "s9/**"
      - "s10/**"
      - "s11/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: e2e node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: install
        run: npm ci --no-audit --no-fund

      - name: build
        run: npm run build

      - name: e2e tests
        run: npm run e2e
